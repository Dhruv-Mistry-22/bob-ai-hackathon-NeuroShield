submission:
  title: "GridPulse AI"                # REQUIRED

  problem_statement: >                 # REQUIRED
    Grid operators lack real-time decision support tools capable of forecasting load spikes, balancing volatile renewable generation, and preemptively identifying transmission stress. As a result, massive amounts of clean energy are unnecessarily curtailed (e.g., ~8 TWh in the US in 2023) because operators cannot safely validate actions before executing them.

  solution_summary: >                  # REQUIRED
    GridPulse AI is a premium, intelligent decision-support interface that acts as a "Performance Advisor". It unifies demand forecasting, renewable anomaly detection, and automated optimization, while uniquely running a counterfactual simulation on any proposed action to guarantee grid stability before an operator commits.

  key_features:                        # REQUIRED
    - "Predictive Counterfactual Action Validation"
    - "Intelligent 15-minute Demand & Renewable Forecasting"
    - "Real-time Asset Anomaly Detection & Root Cause Analysis"
    - "Automated Load-Balancing Optimization for Curtailment Minimization"
    - "Premium 'Command Center' UI with 3D Grid Flow & Timeline Horizons"

  tech_stack:
    languages: ["Python", "HTML", "CSS"]                      # REQUIRED
    frameworks: ["Streamlit", "Scikit-Learn", "Pandas", "Plotly"]
    ibm_technologies: ["IBM Bob"]
    databases: ["CSV"]
    other: ["Playwright"]

  what_we_are_most_proud_of: >         
    We are incredibly proud of the Action Validation (Counterfactual Test) engine and the bespoke UI. Rather than a basic dashboard, we engineered a custom, highly professional dark/light mode "Command Center" interface directly on top of Streamlit that makes interpreting complex optimization constraints intuitive for operators.

  known_limitations: >                 
    Due to time constraints, the current pipeline processes pre-simulated historical datasets rather than connecting to a live grid SCADA feed or real-time IoT message broker.

